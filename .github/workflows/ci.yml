name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # tests/pdfUnpack.test.ts 走 pdftoppm / mutool 真实渲染，runner 镜像不自带
      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & roomServer tests
        run: npm test

      - name: Build frontend & server bundle
        run: |
          npm run build
          npm run build:server
