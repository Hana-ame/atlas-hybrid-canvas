name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推上来就取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # 仓库自带 package-lock.json，可以安全启用依赖缓存。
          # （早期版本没有 lockfile，cache: npm 会在 setup 阶段直接失败）
          cache: npm

      # Pages 项目页在 /<repo>/ 子路径下，资源前缀必须匹配
      - name: Resolve base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved base: $(grep path= "$GITHUB_OUTPUT" | tail -1)"

      # 有 lockfile 时用 npm ci：可复现且更快；缺失时退回 npm install
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # tutorial/ 是独立的静态多页文档，不走 vite 构建；直接拷进 dist/ 一起发布
      - name: Copy tutorial into dist
        run: |
          if [ -d tutorial ]; then
            mkdir -p dist/tutorial
            cp -r tutorial/. dist/tutorial/
            echo "已拷贝 tutorial/ 到 dist/tutorial/："
            ls -1 dist/tutorial
          else
            echo "未找到 tutorial/ 目录，跳过"
          fi

      # Pages 默认会跑 Jekyll，下划线开头的资源会被吞掉；.nojekyll 关掉它
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
